# 검증 명령 설정
# 이 파일은 프로젝트 고유 검증 명령을 외부화한다.
# stop_guard.ps1이 Stop 시점에 enabled=true 인 항목을 순서대로 실행하고
# 결과를 .codex-memory/QA.md에 기록하며, 실패 시 종료를 block 한다.
#
# 대상 프로젝트에 맞춰 command 를 실제 명령으로 채운다.
# command 가 빈 문자열이거나 enabled=false 면 그 항목은 건너뛴다(no-op).
# timeout 은 초 단위다. 지정하지 않으면 기본 120초.
#
# 명령은 프로젝트 루트에서 실행된다.

[lint]
command = ""
enabled = true
timeout = 120

[test]
command = ""
enabled = true
timeout = 300

[typecheck]
command = ""
enabled = true
timeout = 120

[build]
command = ""
enabled = true
timeout = 300